name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint, Format & Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and quality tools
        run: python -m pip install --upgrade pip && pip install -e ".[gui,dev]"
      - name: Check formatting with ruff
        run: ruff format --check tpb tests
      - name: Lint with ruff
        run: ruff check tpb tests
      - name: Type-check with mypy
        run: mypy tpb

  security:
    name: Security & Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install security scanners
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Run Bandit static security scan
        run: bandit -r tpb -ll
      - name: Audit dependencies with pip-audit
        run: pip-audit --skip-editable

  test:
    name: Test Suite (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: [lint-and-typecheck, security]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.14"
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install headless Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[gui,dev]"
      - name: Run pytest
        run: pytest -v

  build:
    name: Package Distribution Build
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build & twine
        run: python -m pip install --upgrade pip && pip install build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Verify package metadata
        run: twine check dist/*
      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
