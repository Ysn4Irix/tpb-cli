[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tpb-cli"
version = "0.1.0"
description = "Interactive Python CLI for searching movies and TV series magnet links via apibay.org"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "rich>=13.0.0",
    "InquirerPy>=0.3.4",
    "prompt_toolkit>=3.0.0",
]

[project.scripts]
tpb = "tpb.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
