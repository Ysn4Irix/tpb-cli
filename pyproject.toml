[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tpb-cli"
version = "0.1.0"
description = "Interactive Python CLI for searching movies and TV series magnet links via apibay.org"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Ysn4Irix"}
]
keywords = [
    "torrent",
    "piratebay",
    "apibay",
    "cli",
    "tui",
    "magnet",
    "scraper",
    "downloader",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: File Sharing",
    "Topic :: Utilities",
]
dependencies = [
    "httpx>=0.27.0",
    "rich>=13.0.0",
    "InquirerPy>=0.3.4",
    "prompt_toolkit>=3.0.0",
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.7.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-qt>=4.4.0",
    "pyinstaller>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/Ysn4Irix/tpb-cli"
Repository = "https://github.com/Ysn4Irix/tpb-cli.git"
Issues = "https://github.com/Ysn4Irix/tpb-cli/issues"

[project.scripts]
tpb = "tpb.cli:main"

[project.gui-scripts]
tpb-gui = "tpb.gui.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tpb*"]
exclude = ["tests*", ".agents*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
